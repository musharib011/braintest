<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Memory Flip - A fun card matching memory game. Test your memory with easy, medium, and hard difficulty levels." />
    <meta name="theme-color" content="#6366f1" />
    <title>Memory Flip - Card Matching Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      html.light, html.light body {
        background-color: #f8fafc;
        color: #1e293b;
      }
      html.dark, html.dark body {
        background-color: #0f172a;
        color: #e2e8f0;
      }
    </style>
    <script>
      (function () {
        function applyTheme(theme) {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        }
        try {
          var saved = localStorage.getItem("memoryFlipTheme");
          applyTheme(saved === "dark" ? "dark" : "light");
        } catch(e) {
          applyTheme("light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
